name: Publish private Render image
on:
  push:
    branches: [baseline-v4]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: pitchvision-image
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image names
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build verified linux/amd64 image
        run: docker build --platform linux/amd64 --tag "$IMAGE:sha-$GITHUB_SHA" --tag "$IMAGE:baseline" .
      - name: Verify container serving
        run: |
          docker run --detach --name smoke --publish 10000:10000 "$IMAGE:sha-$GITHUB_SHA"
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:10000/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:10000/ | grep -q 'PitchVision V4 Baseline'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:10000/demo_pitch_sample.mp4)" = 404
          docker rm --force smoke
      - name: Publish private package
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:baseline"
          printf 'Image: `%s:sha-%s`\n\n' "$IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
