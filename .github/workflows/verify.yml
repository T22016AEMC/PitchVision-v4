name: Verify baseline
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm run build
      - name: Deploy verified push to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/baseline-v4'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo 'RENDER_DEPLOY_HOOK is not configured; public Git URL services require a deploy hook or Git provider connection for automatic updates.'
            exit 0
          fi
          curl --fail --silent --show-error --output /dev/null "${RENDER_DEPLOY_HOOK}&ref=${GITHUB_SHA}"
      - name: Deploy verified push to Render (mobile site)
        if: github.event_name == 'push' && github.ref == 'refs/heads/mobile-v5'
        env:
          RENDER_DEPLOY_HOOK_MOBILE: ${{ secrets.RENDER_DEPLOY_HOOK_MOBILE }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_MOBILE" ]; then
            echo '::notice title=沒有自動部署::RENDER_DEPLOY_HOOK_MOBILE 未設定；mobile-v5 已通過 verify 與 build，但沒有自動部署。'
            echo '沒有自動部署：RENDER_DEPLOY_HOOK_MOBILE is not configured.'
            exit 0
          fi
          curl --fail --silent --show-error --output /dev/null "${RENDER_DEPLOY_HOOK_MOBILE}&ref=${GITHUB_SHA}"
