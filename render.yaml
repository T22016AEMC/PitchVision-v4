services:
  - type: web
    runtime: static
    name: pitchvision-v4
    branch: baseline-v4
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm run verify && corepack pnpm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: SKIP_INSTALL_DEPS
        value: 'true'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
