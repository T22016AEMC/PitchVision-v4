# Configuration reference only: create via Dashboard > Web Service > Existing Image.
# Blueprint import itself requires a Git connection and is not used for this deployment.
services:
  - type: web
    runtime: image
    name: pitchvision-v4
    region: singapore
    plan: free
    healthCheckPath: /healthz
    image:
      url: ghcr.io/t22016aemc/pitchvision-v4:baseline
      creds:
        fromRegistryCreds:
          name: pitchvision-ghcr-read
