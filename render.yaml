services:
  - type: web
    runtime: static
    name: pitchvision-v4
    branch: baseline-v4
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm run verify && corepack pnpm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
